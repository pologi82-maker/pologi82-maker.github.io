<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Мої проекти</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Layout: quiet, editorial. Huge serif title, hairline rules, project cards that stack on scroll. Deep ink background, warm white text, one champagne accent. */
:root{
  --bg:#0B0B0D; --bg2:#101012; --surface:#121215; --surface2:#17171B;
  --fg:#F1EEE8; --muted:#8F8B84; --line:#26262B;
  --accent:#D8C39A; --accent2:#D8C39A; --on-accent:#14110C;
  --glow:rgba(216,195,154,.12); --shade:rgba(0,0,0,.78);
  --display:"Cormorant Garamond",Georgia,"Times New Roman",serif;
  --body:"Geist",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"Geist Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --grain:.07;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#F4F2ED; --bg2:#ECE9E2; --surface:#FFFFFF; --surface2:#F7F5F0;
  --fg:#16150F; --muted:#6B675D; --line:#DAD6CB;
  --accent:#8A6B34; --accent2:#8A6B34; --on-accent:#FFFFFF;
  --glow:rgba(138,107,52,.10); --shade:rgba(22,21,15,.55); --grain:.045; color-scheme:light}}
:root[data-theme="light"]{
  --bg:#F4F2ED; --bg2:#ECE9E2; --surface:#FFFFFF; --surface2:#F7F5F0;
  --fg:#16150F; --muted:#6B675D; --line:#DAD6CB;
  --accent:#8A6B34; --accent2:#8A6B34; --on-accent:#FFFFFF;
  --glow:rgba(138,107,52,.10); --shade:rgba(22,21,15,.55); --grain:.045; color-scheme:light}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:17px;line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:clip}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:8px}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.mono{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

/* progress + cursor glow */
.progress{position:fixed;left:0;top:0;height:2px;width:100%;background:var(--accent);transform:scaleX(0);transform-origin:0 50%;z-index:60}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:70;opacity:var(--grain);mix-blend-mode:overlay;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>")}
.glow{position:fixed;left:0;top:0;width:560px;height:560px;margin:-280px 0 0 -280px;border-radius:50%;background:radial-gradient(closest-side,var(--glow),transparent);pointer-events:none;z-index:0;opacity:0;transition:opacity .4s}
.glow.on{opacity:1}

/* nav */
.nav{position:fixed;z-index:50;top:calc(14px + env(safe-area-inset-top,0px));left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));max-width:520px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 8px 8px 20px;border-radius:999px;border:1px solid var(--line);background:color-mix(in srgb,var(--surface) 72%,transparent);-webkit-backdrop-filter:blur(16px) saturate(1.4);backdrop-filter:blur(16px) saturate(1.4)}
.nav .logo{font-family:var(--display);font-style:italic;font-weight:500;font-size:26px;letter-spacing:-.01em;text-decoration:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.nav ul{display:flex;gap:4px;list-style:none;margin:0;padding:0}
.nav ul a{display:block;text-decoration:none;font-size:14px;font-weight:500;padding:8px 14px;border-radius:999px;color:var(--muted);transition:color .2s,background .2s}
.nav ul a:hover{color:var(--fg);background:var(--surface2)}
.nav .right{display:flex;gap:8px;align-items:center;flex:none}
.icon-btn{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface2);color:var(--fg);cursor:pointer;display:grid;place-items:center;font-size:16px;line-height:1}
.pill{display:inline-flex;align-items:center;gap:8px;text-decoration:none;font-weight:600;font-size:14px;border-radius:999px;padding:10px 18px;background:var(--fg);color:var(--bg);border:1px solid var(--fg);cursor:pointer;font-family:inherit;transition:transform .2s}
.pill:hover{transform:translateY(-2px)}
.pill.ghost{background:transparent;color:var(--fg);border-color:var(--line)}
.pill.ghost:hover{border-color:var(--fg)}
.pill.accent{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
@media (max-width:700px){.nav ul{display:none}}

/* notice */
.notice{position:relative;z-index:1;text-align:center;font-size:13px;color:var(--muted);padding:96px 16px 0}
.notice b{color:var(--fg);font-weight:600}

/* hero */
.hero{position:relative;overflow:hidden;isolation:isolate}
.hero::before{content:"";position:absolute;inset:0;z-index:-1;background:radial-gradient(60% 60% at 50% 0%,var(--glow),transparent 72%)}
.hero .wrap{padding-block:88px 24px}
h1.mega{font-family:var(--display);font-weight:500;font-size:clamp(84px,18vw,280px);line-height:.86;letter-spacing:-.035em;margin:0}
.mega .ln{display:inline-block;overflow:hidden;vertical-align:top;padding-bottom:.12em;margin-bottom:-.12em;padding-right:.04em}
.mega .w{display:inline-block;transform:translateY(108%);animation:rise 1.1s cubic-bezier(.2,.8,.2,1) forwards;animation-delay:calc(var(--i)*110ms + 150ms)}
@keyframes rise{to{transform:none}}
.mega .hl{font-style:italic;color:var(--accent)}
.hero-rule{height:1px;background:var(--line);margin-top:48px;transform-origin:0 50%;animation:grow 1.6s .5s cubic-bezier(.2,.8,.2,1) both}
@keyframes grow{from{transform:scaleX(0)}}

/* marquee */
.marquee{border-block:1px solid var(--line);background:var(--bg2);overflow:hidden;padding:18px 0}
.track{display:flex;width:max-content;animation:scroll 42s linear infinite}
.marquee:hover .track{animation-play-state:paused}
.track span{display:flex;align-items:center;gap:36px;padding-right:36px;font-family:var(--display);font-weight:500;font-size:clamp(20px,2.4vw,30px);letter-spacing:-.02em;color:var(--muted);white-space:nowrap}
.track i{width:8px;height:8px;border-radius:50%;background:var(--accent);display:block}
@keyframes scroll{to{transform:translateX(-50%)}}

/* sections */
section{position:relative;z-index:1}
.sec-head{display:flex;flex-wrap:wrap;gap:20px 32px;justify-content:space-between;align-items:end;padding-block:40px 36px}
h2.title{font-family:var(--display);font-weight:500;font-size:clamp(36px,6vw,80px);line-height:1;letter-spacing:-.035em;margin:0;text-wrap:balance}
.filters{display:flex;flex-wrap:wrap;gap:8px}
.filters button{font:inherit;font-size:14px;font-weight:500;cursor:pointer;border:1px solid var(--line);background:transparent;color:var(--fg);padding:9px 16px;border-radius:999px;transition:background .2s,color .2s,border-color .2s}
.filters button:hover{border-color:var(--fg)}
.filters button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.filters sup{font-family:var(--mono);font-size:10px;margin-left:5px;opacity:.7}

/* project cards */
.stack{display:grid;gap:28px;padding-bottom:40px}
.proj{--h:220;position:relative;display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:0;text-decoration:none;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:22px;overflow:hidden;transform:scale(var(--s,1));transform-origin:50% 0;transition:border-color .3s;isolation:isolate}
.proj:hover{border-color:color-mix(in srgb,var(--accent) 60%,var(--line))}
.proj::before{content:"";position:absolute;inset:0;z-index:0;background:radial-gradient(500px circle at var(--mx,50%) var(--my,0%),var(--glow),transparent 60%);opacity:0;transition:opacity .3s;pointer-events:none}
.proj:hover::before{opacity:1}
.proj::after{content:"";position:absolute;inset:0;z-index:5;background:var(--bg);opacity:var(--d,0);pointer-events:none}
@media (min-width:900px){.proj{position:sticky;top:calc(92px + env(safe-area-inset-top,0px) + var(--i,0)*14px);min-height:540px}}
.info{position:relative;z-index:1;padding:clamp(24px,3.4vw,48px);display:flex;flex-direction:column;gap:18px;min-width:0}
.info .top{display:flex;justify-content:space-between;gap:12px;align-items:center}
.tag-example{font-family:var(--mono);font-size:10px;letter-spacing:.06em;padding:3px 8px;border-radius:6px;background:color-mix(in srgb,var(--accent) 18%,transparent);color:var(--accent);text-transform:uppercase}
.proj h3{font-family:var(--display);font-weight:500;font-size:clamp(44px,5.6vw,80px);line-height:.95;letter-spacing:-.02em;margin:0;text-wrap:balance}
.proj .sum{margin:0;color:var(--muted);max-width:42ch;font-size:17px}
.chips{display:flex;flex-wrap:wrap;gap:6px;list-style:none;padding:0;margin:0}
.chips li{font-family:var(--mono);font-size:12px;padding:4px 10px;border-radius:8px;border:1px solid var(--line);color:var(--muted)}
.info .bottom{margin-top:auto;display:flex;justify-content:space-between;align-items:center;gap:12px;padding-top:12px}
.open{display:inline-flex;gap:12px;align-items:center;font-weight:600;font-size:15px}
.arrow{width:52px;height:52px;border-radius:50%;border:1px solid var(--accent);color:var(--accent);display:grid;place-items:center;font-size:20px;transition:transform .35s cubic-bezier(.2,.8,.2,1),background .3s,color .3s}
.proj:hover .arrow{transform:rotate(-45deg);background:var(--accent);color:var(--on-accent)}
.media{position:relative;z-index:1;min-height:320px;display:grid;place-items:center;padding:clamp(20px,3vw,44px);background:radial-gradient(ellipse at 30% 0%,hsl(var(--h) 50% 50%/.20),transparent 65%),var(--surface2);perspective:1100px;min-width:0}
.media .frame{width:100%;aspect-ratio:16/10;border-radius:14px;overflow:hidden;border:1px solid color-mix(in srgb,var(--fg) 14%,transparent);box-shadow:0 40px 80px -30px rgba(0,0,0,.55);transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .25s ease-out;background:var(--surface)}
.media img{width:100%;height:100%;object-fit:cover;display:block}
@media (max-width:899px){.proj{grid-template-columns:minmax(0,1fr)}.media{order:-1;min-height:0}}

/* about bento */
.bento{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:16px}
.cell{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:clamp(22px,2.6vw,36px);min-width:0;transition:border-color .3s,transform .4s cubic-bezier(.2,.8,.2,1)}
.cell:hover{border-color:color-mix(in srgb,var(--accent) 50%,var(--line));transform:translateY(-4px)}
.cell h3{margin:0 0 14px;font-family:var(--mono);font-size:12px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.c-bio{grid-column:span 4;grid-row:span 2;display:flex;flex-direction:column;justify-content:space-between;gap:28px}
.c-bio p{margin:0;font-family:var(--display);font-weight:500;font-size:clamp(24px,3vw,40px);line-height:1.12;letter-spacing:-.025em;text-wrap:pretty}
.c-bio p em{font-style:normal;color:var(--accent)}
.c-time{grid-column:span 2;display:flex;flex-direction:column;justify-content:space-between;gap:12px}
.clock{font-family:var(--display);font-weight:500;font-size:clamp(44px,5vw,64px);line-height:1;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.c-stats{grid-column:span 2;display:grid;gap:14px}
.stat{display:flex;align-items:baseline;gap:12px}
.stat b{font-family:var(--display);font-weight:500;font-size:44px;line-height:1;letter-spacing:-.03em;font-variant-numeric:tabular-nums;min-width:2.2ch}
.stat span{color:var(--muted);font-size:15px}
.c-skills{grid-column:span 3}
.c-flow{grid-column:span 3}
.flow{list-style:none;margin:0;padding:0;display:grid;gap:12px;counter-reset:s}
.flow li{counter-increment:s;display:grid;grid-template-columns:34px minmax(0,1fr);gap:12px;align-items:start}
.flow li::before{content:counter(s);width:34px;height:34px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-family:var(--mono);font-size:12px;color:var(--accent)}
.flow b{display:block;font-weight:600}
.flow span{color:var(--muted);font-size:15px}
@media (max-width:900px){.c-bio,.c-time,.c-stats,.c-skills,.c-flow{grid-column:span 6;grid-row:auto}.c-time,.c-stats{grid-column:span 3}}
@media (max-width:560px){.c-time,.c-stats{grid-column:span 6}}

/* contact */
.contact{padding-block:120px 72px;text-align:left}
.contact h2{font-family:var(--display);font-weight:500;font-size:clamp(44px,10vw,150px);line-height:.92;letter-spacing:-.045em;margin:0 0 40px;text-wrap:balance}
.contact h2 span{display:inline-block;transition:transform .5s cubic-bezier(.2,.8,.2,1)}
.contact h2:hover span{transform:translateX(.12em)}
.contact h2 .hl{background:linear-gradient(100deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
.mail-row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.mail{font-family:var(--mono);font-size:clamp(15px,2vw,20px);padding:12px 18px;border:1px solid var(--line);border-radius:999px;background:var(--surface);user-select:all;overflow-wrap:anywhere}
.socials{display:flex;flex-wrap:wrap;gap:8px;list-style:none;padding:0;margin:28px 0 0}
.socials a{display:inline-flex;gap:10px;align-items:baseline;text-decoration:none;border:1px solid var(--line);padding:9px 16px;border-radius:999px;font-size:15px;transition:border-color .2s,transform .2s}
.socials a:hover{border-color:var(--accent);transform:translateY(-2px)}
.socials span{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
footer .wrap{padding-block:28px 44px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;color:var(--muted);font-size:14px}

/* reveal: content stays visible, only position animates */
.rv{transform:translateY(36px);transition:transform .9s cubic-bezier(.2,.8,.2,1)}
.rv.in{transform:none}

/* detail dialog */
dialog{border:0;padding:0;width:min(1120px,100%);max-width:100%;max-height:100%;height:100%;margin:0 auto;background:var(--bg);color:var(--fg)}
dialog::backdrop{background:var(--shade);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
dialog[open]{animation:pop .4s cubic-bezier(.2,.8,.2,1)}
@keyframes pop{from{transform:translateY(32px) scale(.98);opacity:0}to{transform:none;opacity:1}}
@media (min-width:900px){dialog{height:auto;max-height:calc(100% - 48px);margin:24px auto;border-radius:24px;border:1px solid var(--line)}}
.d-top{position:sticky;top:0;z-index:2;background:var(--bg);display:flex;justify-content:space-between;align-items:center;gap:16px;padding:14px max(16px,env(safe-area-inset-right,0px)) 14px max(16px,env(safe-area-inset-left,0px));padding-top:calc(14px + env(safe-area-inset-top,0px));border-bottom:1px solid var(--line)}
@media (min-width:900px){.d-top{padding-top:14px}}
.d-meta{display:flex;gap:10px;align-items:center;min-width:0;flex-wrap:wrap}
.d-body{padding:28px max(16px,env(safe-area-inset-right,0px)) 48px max(16px,env(safe-area-inset-left,0px))}
@media (min-width:900px){.d-body{padding:36px 44px 52px}}
.d-body h2{font-family:var(--display);font-weight:500;font-size:clamp(48px,7vw,100px);line-height:.92;margin:0 0 16px;letter-spacing:-.025em;text-wrap:balance}
.lead{font-size:19px;color:var(--muted);margin:0 0 28px;max-width:60ch}
.stage{border-radius:18px;overflow:hidden;border:1px solid var(--line);background:var(--surface);aspect-ratio:16/10;max-width:100%}
.stage img{width:100%;height:100%;object-fit:contain;display:block}
.thumbs{display:flex;gap:10px;margin-top:12px;overflow-x:auto;padding-bottom:4px}
.thumbs button{flex:0 0 auto;width:120px;aspect-ratio:16/10;padding:0;border-radius:10px;overflow:hidden;border:2px solid transparent;cursor:pointer;background:var(--surface)}
.thumbs button[aria-current="true"]{border-color:var(--accent)}
.thumbs img{width:100%;height:100%;object-fit:cover;display:block}
.cols{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:48px;margin-top:40px}
.cols h3{font-family:var(--mono);font-size:12px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 10px}
.cols section+section{margin-top:28px}
.cols p{margin:0;max-width:62ch}
.cols ul.done{margin:0;padding-left:20px;display:grid;gap:6px}
.facts{display:grid;gap:22px;align-content:start;border-left:1px solid var(--line);padding-left:28px}
.facts dl{margin:0;display:grid;gap:16px}
.facts dt{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.facts dd{margin:2px 0 0}
.links{display:flex;flex-wrap:wrap;gap:10px}
.result{font-family:var(--display);font-size:34px;line-height:1.15}
@media (max-width:820px){.cols{grid-template-columns:minmax(0,1fr);gap:32px}.facts{border-left:0;padding-left:0;border-top:1px solid var(--line);padding-top:24px}}

@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  .blob,.track,.pulse::after{animation:none}
  .mega .w{animation:none;transform:none}
  .rv{transform:none;transition:none}
  .proj,.cell,.arrow,.media .frame{transition:none}
  dialog[open]{animation:none}
}
</style>

<div class="progress" id="progress"></div>
<div class="glow" id="glow"></div>

<header class="hero" id="top">
  <div class="wrap"><h1 class="mega" id="h-title"></h1><div class="hero-rule"></div></div>
</header>

<section id="work">
  <div class="wrap">
    <div class="sec-head">
      <div style="display:grid;gap:14px;justify-items:start">
        <div class="filters" id="filters" role="group" aria-label="Тип проєкту"></div>
        <span class="mono" id="count"></span>
      </div>
    </div>
    <div class="stack" id="stack"></div>
  </div>
</section>

<dialog id="detail" aria-labelledby="d-title">
  <div class="d-top">
    <div class="d-meta mono" id="d-meta"></div>
    <button class="pill ghost" id="d-close" type="button">Закрити ✕</button>
  </div>
  <div class="d-body">
    <h2 id="d-title"></h2>
    <p class="lead" id="d-lead"></p>
    <div class="stage"><img id="d-img" alt=""></div>
    <div class="thumbs" id="d-thumbs"></div>
    <div class="cols">
      <div>
        <section><h3>Задача</h3><p id="d-task"></p></section>
        <section><h3>Що зроблено</h3><ul class="done" id="d-done"></ul></section>
        <section><h3>Результат</h3><p class="result" id="d-result"></p></section>
      </div>
      <aside class="facts">
        <dl id="d-facts"></dl>
        <div><h3>Технології</h3><ul class="chips" id="d-stack"></ul></div>
        <div class="links" id="d-links"></div>
      </aside>
    </div>
  </div>
</dialog>

<script>
/* =====================================================================
   ВАШІ ДАНІ. Редагуйте лише цей блок.
   ===================================================================== */
const TITLE = "Мої проекти";

const CATEGORIES = { web: "Сайти", saas: "Веб-сервіси", app: "Мобільні додатки" };

/* Проєкти. images: шляхи до скриншотів, напр. ["images/zerno-1.png"].
   Поки images порожній, показується намальований макет у кольорі hue (0–360).
   example: true додає позначку «Приклад». */
const PROJECTS = [
  {
    id: "zerno", example: true, category: "web", year: 2025, hue: 24,
    title: "Кавʼярня «Зерно»",
    summary: "Сайт мережі кавʼярень з онлайн-меню, бронюванням столиків і замовленням на виніс.",

const hsl = (h,s,l,a) => a === undefined ? `hsl(${h},${s}%,${l}%)` : `hsla(${h},${s}%,${l}%,${a})`;

const GL = (x,y,w,h,rx=18) => R(x,y,w,h,W(.05),rx,`stroke="${W(.11)}" stroke-width="1.5"`);

  } else {

    b += R(900,170,620,470,"url(#a)",36,'opacity=".92"')+`<circle cx="1210" cy="400" r="170" fill="${W(.16)}"/><circle cx="1210" cy="400" r="96" fill="${W(.2)}"/>`+GL(850,510,270,120,24)+R(876,538,110,14,W(.8),7)+R(876,570,170,12,W(.35),6)+GL(1380,200,200,92,22)+R(1404,226,90,14,W(.8),7);
    for (let i=0;i<3;i++){ const x=80+i*490; b += GL(x,700,440,250,26)+R(x+32,734,60,60,"url(#a)",16,'opacity=".85"')+R(x+32,822,250,18,W(.8),9)+R(x+32,858,360,13,W(.25),6)+R(x+32,882,300,13,W(.25),6); }

function phoneScreen(i,x,y,w,h,hue,type){

    for (let k=0;k<2;k++) b += GL(x+26,y+590+k*72,w-52,58,18)+R(x+48,y+610+k*72,150,16,W(.45),8);
  } else if (type==="list"){
    b += R(x,y,w,210,"url(#a)")+R(x+30,y+86,180,22,"#fff",11)+R(x+30,y+122,120,13,W(.55),6)+R(x+26,y+168,w-52,52,W(.92),26);
    for (let k=0;k<6;k++){ const yy=y+256+k*76; b += `<circle cx="${x+58}" cy="${yy+28}" r="25" fill="${hsl((hue+k*14)%360,60,52,.55)}"/>`+R(x+98,yy+12,150,14,W(.8),7)+R(x+98,yy+36,100,12,W(.25),6)+R(x+28,yy+66,w-56,1,W(.08)); }
  } else {
    b += R(x+30,y+74,190,22,W(.85),11)+R(x+26,y+120,w-52,150,"url(#a)",24)+R(x+48,y+148,130,18,"#fff",9)+R(x+48,y+178,90,12,W(.55),6);
    for (let k=0;k<4;k++){ const xx=x+26+(k%2)*((w-52)/2+6), yy=y+296+Math.floor(k/2)*196, ww=(w-52)/2-6;
      b += GL(xx,yy,ww,180,22)+`<circle cx="${xx+ww/2}" cy="${yy+68}" r="40" fill="${hsl((hue+k*22)%360,65,55,.55)}"/>`+R(xx+16,yy+128,ww-52,14,W(.75),7)+R(xx+16,yy+152,56,12,"url(#a)",6); }
  }
  b += R(x,y+h-76,w,76,W(.06))+R(x,y+h-76,w,1,W(.1));
  for (let k=0;k<4;k++) b += `<circle cx="${x+w*(k+.5)/4}" cy="${y+h-38}" r="11" fill="${k===0?hsl(hue,80,66):W(.25)}"/>`;

function mockApp(h, first){
  const order = ["ring","list","tiles"]; const s = order.indexOf(first); const seq = [0,1,2].map(i=>order[(s+i)%3]);
  let b = defs(h) + R(0,0,1600,1000,"url(#bg)") + R(0,0,1600,1000,"url(#rg)");
  [[250,150],[620,90],[990,150]].forEach(([x,y],i)=>{ b += R(x,y,360,780,W(.1),56,`stroke="${W(.18)}" stroke-width="2"`)+phoneScreen(i,x+10,y+10,340,760,h,seq[i])+R(x+130,y+26,100,22,"#000",11); });
  return uri(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000">${b}</svg>`);
}
function shotsFor(p){
  if (p.images && p.images.length) return p.images;
  return (p.mocks||["hero"]).map(k => p.category==="app" ? mockApp(p.hue, k) : mockWeb(p.hue, k));
}

let filter = "all";
function renderFilters(){
  const opts = [["all","Усі",PROJECTS.length], ...Object.entries(CATEGORIES).map(([k,v])=>[k,v,PROJECTS.filter(p=>p.category===k).length]).filter(o=>o[2]>0)];
  $("#filters").innerHTML = opts.map(([k,v,n]) => `<button type="button" data-f="${k}" aria-pressed="${k===filter}">${esc(v)}<sup>${n}</sup></button>`).join("");
}
function plural(n,f){ const a=n%10,b=n%100; return f[(a===1&&b!==11)?0:(a>=2&&a<=4&&(b<12||b>14))?1:2]; }
function renderStack(){
  const list = PROJECTS.filter(p => filter==="all" || p.category===filter);
  $("#count").textContent = list.length + " " + plural(list.length, ["проєкт","проєкти","проєктів"]);
  $("#stack").innerHTML = list.map((p,i) => `
    <a class="proj" href="#p-${esc(p.id)}" style="--h:${p.hue};--i:${i}" aria-label="Відкрити проєкт ${esc(p.title)}">
      <div class="info">
        <div class="top"><span class="mono">${esc(CATEGORIES[p.category]||"")} · ${esc(p.year)}</span></div>
        <h3>${esc(p.title)}</h3>

        <div class="bottom"><span class="open">Дивитися проєкт</span><span class="arrow" aria-hidden="true">→</span></div>
      </div>
      <div class="media"><div class="frame"><img src="${shotsFor(p)[0]}" alt="" loading="lazy"></div></div>
    </a>`).join("");
  bindCards(); stackFx();
}
$("#filters").addEventListener("click", e => { const b=e.target.closest("button"); if(!b) return; filter=b.dataset.f; renderFilters(); renderStack(); });

/* підсвітка під курсором і нахил скриншота */
function bindCards(){
  $$(".proj").forEach(c => {
    c.addEventListener("pointermove", e => {
      const r = c.getBoundingClientRect();
      c.style.setProperty("--mx", (e.clientX - r.left) + "px");
      c.style.setProperty("--my", (e.clientY - r.top) + "px");
      if (reduce || e.pointerType !== "mouse") return;
      const m = c.querySelector(".media").getBoundingClientRect();
      const x = (e.clientX - m.left) / m.width - .5, y = (e.clientY - m.top) / m.height - .5;
      const f = c.querySelector(".frame");
      f.style.setProperty("--ry", (x * 8).toFixed(2) + "deg");
      f.style.setProperty("--rx", (-y * 8).toFixed(2) + "deg");
    });
    c.addEventListener("pointerleave", () => { const f = c.querySelector(".frame"); f.style.setProperty("--rx","0deg"); f.style.setProperty("--ry","0deg"); });
  });
}

/* картки накладаються і трохи зменшуються, коли їх закриває наступна */
function stackFx(){
  const cards = $$(".proj");
  cards.forEach((c,i) => {
    if (!wide.matches || reduce || !cards[i+1]) { c.style.removeProperty("--s"); c.style.removeProperty("--d"); return; }
    const top = parseFloat(getComputedStyle(c).top) || 0;
    const d = cards[i+1].getBoundingClientRect().top - top;
    const p = Math.min(1, Math.max(0, 1 - d / c.offsetHeight));
    c.style.setProperty("--s", (1 - p * .06).toFixed(4));
    c.style.setProperty("--d", (p * .55).toFixed(3));
  });
}

/* ---------- прокрутка: смужка, поява блоків, лічильники ---------- */
const bar = $("#progress");
let ticking = false;
function onScroll(){
  if (ticking) return; ticking = true;
  requestAnimationFrame(() => {
    const h = document.documentElement.scrollHeight - innerHeight;
    bar.style.transform = `scaleX(${h > 0 ? Math.min(1, scrollY / h) : 0})`;
    stackFx(); ticking = false;
  });
}
addEventListener("scroll", onScroll, { passive:true });
addEventListener("resize", onScroll);

/* підсвітка під курсором на всій сторінці */
const glow = $("#glow");
if (matchMedia("(pointer:fine)").matches && !reduce){
  addEventListener("pointermove", e => { glow.style.transform = `translate(${e.clientX}px,${e.clientY}px)`; glow.classList.add("on"); }, { passive:true });
  document.addEventListener("pointerleave", () => glow.classList.remove("on"));
}

  $("#d-done").innerHTML = p.done.map(d=>`<li>${esc(d)}</li>`).join("");
  $("#d-result").textContent = p.result;
  $("#d-facts").innerHTML = [["Клієнт",p.client],["Моя роль",p.role],["Термін",p.duration],["Рік",p.year]].filter(f=>f[1]).map(([k,v])=>`<div><dt>${k}</dt><dd>${esc(v)}</dd></div>`).join("");
  $("#d-stack").innerHTML = p.stack.map(s=>`<li>${esc(s)}</li>`).join("");
  $("#d-links").innerHTML = (p.links||[]).map((l,i)=>`<a class="pill${i===0?' accent':' ghost'}" href="${esc(l.href)}" target="_blank" rel="noopener">${esc(l.label)} ↗</a>`).join("");
  if (!dlg.open) dlg.showModal();
  dlg.scrollTop = 0;
}
function route(){
  const id = location.hash.replace(/^#p-/, "");
  const p = location.hash.startsWith("#p-") && PROJECTS.find(x=>x.id===id);
  if (p) openProject(p); else if (dlg.open) dlg.close();
}
function closeDetail(){ if (dlg.open) dlg.close(); }
dlg.addEventListener("close", () => { if (location.hash.startsWith("#p-")) { try { history.replaceState(null, "", location.pathname + location.search); } catch(e) { location.hash = "work"; } } });
$("#d-close").addEventListener("click", closeDetail);
dlg.addEventListener("click", e => { if (e.target === dlg) closeDetail(); });
addEventListener("hashchange", route);

renderFilters(); renderStack(); route(); onScroll();
</script>

</body>
</html>
